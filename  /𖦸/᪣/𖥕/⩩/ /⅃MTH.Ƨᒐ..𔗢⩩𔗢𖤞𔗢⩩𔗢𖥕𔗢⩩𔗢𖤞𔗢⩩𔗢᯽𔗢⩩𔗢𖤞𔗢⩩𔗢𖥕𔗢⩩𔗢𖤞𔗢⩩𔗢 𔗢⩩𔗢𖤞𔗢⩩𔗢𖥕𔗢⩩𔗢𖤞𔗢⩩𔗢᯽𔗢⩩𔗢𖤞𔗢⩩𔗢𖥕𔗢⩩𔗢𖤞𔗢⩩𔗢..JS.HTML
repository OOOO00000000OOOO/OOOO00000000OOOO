<SCRIPT>
const COLOR_STEP = "O";

const GG = Math.pow(3, 6);
const PIXEL_SIZE = Math.pow(3, 0);
const STEP = PIXEL_SIZE + 0 * PIXEL_SIZE;
const GAP = (STEP - PIXEL_SIZE) / 2;

const canvas = document.getElementById("⩩");
canvas.width = GG * STEP;
canvas.height = GG * STEP;

const ctx = canvas.getContext("2d",{alpha:true});

const totalPixels = GG * GG;
const onesCount = new Uint8Array(totalPixels);
let maxOnes = 0;

for (let i = 1; i < totalPixels; i++) {
onesCount[i] = onesCount[(i / 3) | 0] + (i % 3 === 1 ? 1 : 0);
if (onesCount[i] > maxOnes) maxOnes = onesCount[i];
}

const center = GG >> 1;
const centerIdx = center * GG + center;
const target = onesCount[centerIdx];

for (let y = 0; y < GG; y++) {
for (let x = 0; x < GG; x++) {
const idx = y * GG + x;
const val = onesCount[idx];

let v;
if (COLOR_STEP === "O") {
v = Math.round(255 * (val / maxOnes));
} else if (COLOR_STEP === "0" || COLOR_STEP === 0) {
v = 255;
} else {
v = 255 - (target - val) * Number(COLOR_STEP);
v = v < 0 ? 0 : v > 255 ? 255 : v;
}

ctx.fillStyle = `rgba(${v},${v},${v},${v / 255})`;
ctx.fillRect(x * STEP + GAP, y * STEP + GAP, PIXEL_SIZE, PIXEL_SIZE);
}
}

<SCRIPT>
window.ꕤ=(84.406022589954030768899117092091000289089388918088900852079/Math.pow(3,6))

function renderInstance(container)
{
MAX_LINES=parseInt(container.dataset.maxLines) || 40
container.textContent=""

G=performance.now()/1000/parseFloat(eval(container.dataset.g))

columns=[]
maxColHeight=0

for (i=Math.floor(G);i>=0;i--)
{
t=i.toString(3) //.replace(/(\..{}).*/,'$1')\\
bars=[...t].map((O,I,H)=>
{
if (O!=='1') return ' '
OO=H.slice(0,I).filter(X=>X==='0'||X==='1'||X==='2').length
return (OO%3===0) ? '🟢' : '🟩'
}
)
columns.push(bars)
maxColHeight=Math.max(maxColHeight,bars.length)

if (columns.length>MAX_LINES*1) break
}

totalRows=maxColHeight

rows=[]
for (row=0;row<totalRows;row++)
{
line=Array(MAX_LINES*2+1).fill(' ')

columns.forEach((col,idx)=>
{
colHeight=col.length
bar=col[colHeight-totalRows+row]
if (!bar) return
L=MAX_LINES-idx
R=MAX_LINES+idx
if (L>= 0) line[L]=bar
if (R<MAX_LINES*2+1) line[R]=bar
}
)

line[MAX_LINES]=(row%3 === 0) ? '⚪' : '⬜'
//' ' : ' '\\
//'⚪' : '⬜'\\
//'🟢' : '🟩'\\
rows.push(line.join(''))
}

//middleRow=rows[0]
middleRow=rows.reverse()[0]
upward=rows.slice(1)
downward=rows.slice(1).reverse()
;

[...downward, middleRow, ...upward].forEach(line=>
{
div=document.createElement("DIV")
div.textContent=line
div.style.cssText=`WHITE-SPACE:NOWRAP;LINE-HEIGHT:1;COLOR:RGBA(0,244,124,1.148125);TEXT-ALIGN:CENTER;FILTER:SATURATE(2)`
container.appendChild(div)
}
)
}

function animate()
{
document.querySelectorAll("[data-palindrome]").forEach(el => renderInstance(el))
requestAnimationFrame(animate)
}
animate()
</SCRIPT>
